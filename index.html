<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memotest 日本語</title>
<style>
  :root {
    --fondo: #f5f0e6;
    --panel: #fffdf8;
    --tinta: #1f1d1a;
    --suave: #6b655c;
    --linea: #d9d1c3;
    --rojo: #b8322a;
    --rojo-osc: #8e241e;
    --verde: #2f7a4f;
    --sombra: 0 2px 8px rgba(40, 30, 20, .12);
    --jp: "Noto Sans JP", "Yu Gothic UI", "Yu Gothic", "Meiryo", "Hiragino Sans", sans-serif;
    --ui: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fondo: #1b1917; --panel: #26231f; --tinta: #f1ece3; --suave: #aaa197;
      --linea: #3d3832; --rojo: #c9463c; --rojo-osc: #9c3027; --verde: #4fa874;
      --sombra: 0 2px 8px rgba(0, 0, 0, .4);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--fondo); color: var(--tinta); font-family: var(--ui);
    display: flex; flex-direction: column;
  }
  button { font: inherit; cursor: pointer; }
  .oculto { display: none !important; }

  /* ---------- MENÚ ---------- */
  #menu { flex: 1; display: grid; place-items: center; padding: 24px 16px; }
  .caja {
    background: var(--panel); border: 1px solid var(--linea); border-radius: 14px;
    box-shadow: var(--sombra); padding: 28px 28px 24px; width: min(520px, 100%);
  }
  h1 { margin: 0 0 4px; font-size: 28px; display: flex; gap: 10px; align-items: baseline; }
  h1 .jp { font-family: var(--jp); color: var(--rojo); }
  .sub { margin: 0 0 22px; color: var(--suave); font-size: 14px; }
  .grupo { margin-bottom: 18px; }
  .grupo > span { display: block; font-size: 13px; font-weight: 600; color: var(--suave);
    text-transform: uppercase; letter-spacing: .04em; margin-bottom: 8px; }
  .opciones { display: flex; flex-wrap: wrap; gap: 8px; }
  .op {
    border: 1px solid var(--linea); background: transparent; color: var(--tinta);
    border-radius: 999px; padding: 7px 14px; font-size: 14px;
  }
  .op:hover { border-color: var(--suave); }
  .op.activo { background: var(--tinta); color: var(--panel); border-color: var(--tinta); }
  .ayuda { font-size: 13px; color: var(--suave); margin-top: 6px; min-height: 1.2em; }
  .principal {
    width: 100%; margin-top: 8px; padding: 13px; border: 0; border-radius: 10px;
    background: var(--rojo); color: #fff; font-size: 17px; font-weight: 600;
  }
  .principal:hover { background: var(--rojo-osc); }
  .pie { margin-top: 14px; font-size: 12px; color: var(--suave); text-align: center; }

  /* ---------- BARRA DE JUEGO ---------- */
  #barra {
    display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
    padding: 10px 16px; border-bottom: 1px solid var(--linea); background: var(--panel);
  }
  #barra .dato { font-size: 14px; color: var(--suave); }
  #barra .dato b { color: var(--tinta); font-variant-numeric: tabular-nums; }
  #barra .espacio { flex: 1; }
  .sec {
    border: 1px solid var(--linea); background: transparent; color: var(--tinta);
    border-radius: 8px; padding: 6px 12px; font-size: 14px;
  }
  .sec:hover { border-color: var(--suave); }

  /* ---------- TABLERO ---------- */
  #zona { flex: 1; display: grid; place-items: center; padding: 14px; overflow: hidden; }
  #tablero { display: grid; gap: var(--gap, 10px); }
  .carta {
    width: var(--w); height: var(--h); perspective: 900px; border: 0; padding: 0;
    background: transparent;
  }
  .giro {
    position: relative; width: 100%; height: 100%; transition: transform .35s ease;
    transform-style: preserve-3d;
  }
  .carta.vista .giro, .carta.hecha .giro { transform: rotateY(180deg); }
  .cara {
    position: absolute; inset: 0; border-radius: 10px; backface-visibility: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    box-shadow: var(--sombra);
  }
  .dorso {
    background: var(--rojo);
    background-image: radial-gradient(circle at 50% 50%, rgba(255,255,255,.95) 0 17%, transparent 18%),
      repeating-linear-gradient(45deg, rgba(0,0,0,.06) 0 6px, transparent 6px 12px);
    border: 3px solid rgba(255,255,255,.35);
  }
  .carta:not(.vista):not(.hecha):hover .dorso { filter: brightness(1.08); }
  .frente {
    transform: rotateY(180deg); background: var(--panel); border: 2px solid var(--tinta);
    padding: 6%; text-align: center; gap: 4%;
  }
  .carta.hecha .frente { border-color: var(--verde); }
  .carta.hecha { cursor: default; }
  .kana { font-family: var(--jp); font-weight: 700; font-size: var(--fk); line-height: 1.1;
    white-space: nowrap; }
  .romaji { font-size: var(--fr); color: var(--suave); }
  .es { font-size: var(--fe); color: var(--suave); line-height: 1.2; max-width: 100%; }
  .solo-es .es { font-size: calc(var(--fk) * .62); color: var(--tinta); font-weight: 600; }

  /* ---------- FINAL ---------- */
  #final { position: fixed; inset: 0; background: rgba(20, 15, 10, .55);
    display: grid; place-items: center; padding: 16px; }
  #final .caja { max-height: 90vh; overflow: auto; }
  .resumen { display: flex; gap: 12px; margin: 14px 0 18px; }
  .resumen div { flex: 1; background: var(--fondo); border-radius: 10px; padding: 10px; text-align: center; }
  .resumen b { display: block; font-size: 24px; font-variant-numeric: tabular-nums; }
  .resumen small { color: var(--suave); font-size: 12px; }
  .record { color: var(--verde); font-weight: 600; font-size: 14px; margin: -6px 0 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; margin-bottom: 16px; }
  td { padding: 6px 4px; border-bottom: 1px solid var(--linea); }
  td.k { font-family: var(--jp); font-weight: 700; font-size: 17px; }
  td.r { color: var(--suave); }
  .botones { display: flex; gap: 10px; position: sticky; bottom: -24px; background: var(--panel);
    padding: 12px 0 0; margin-bottom: -4px; }
  .botones .principal { margin: 0; }
  .botones .sec { flex: 0 0 auto; padding: 12px 18px; }
</style>
</head>
<body>

<section id="menu">
  <div class="caja">
    <h1><span class="jp">日本語</span> Memotest</h1>
    <p class="sub"><span id="total"></span> palabras del JLPT N5</p>

    <div class="grupo">
      <span>Pares</span>
      <div class="opciones" data-opcion="pares">
        <button class="op" data-v="6">6</button>
        <button class="op activo" data-v="8">8</button>
        <button class="op" data-v="12">12</button>
        <button class="op" data-v="15">15</button>
        <button class="op" data-v="18">18</button>
      </div>
    </div>

    <div class="grupo">
      <span>Palabras</span>
      <div class="opciones" data-opcion="tipo">
        <button class="op activo" data-v="todos">Todas</button>
        <button class="op" data-v="hiragana">Hiragana</button>
        <button class="op" data-v="katakana">Katakana</button>
      </div>
    </div>

    <div class="grupo">
      <span>Modo</span>
      <div class="opciones" data-opcion="modo">
        <button class="op activo" data-v="clasico">Clásico</button>
        <button class="op" data-v="aprender">Aprender</button>
      </div>
      <div class="ayuda" id="ayudaModo"></div>
    </div>

    <div class="grupo" id="grupoRomaji">
      <span>Romaji en la carta japonesa</span>
      <div class="opciones" data-opcion="romaji">
        <button class="op activo" data-v="si">Mostrar</button>
        <button class="op" data-v="no">Ocultar</button>
      </div>
    </div>

    <div class="grupo">
      <span>Pronunciación al encontrar un par</span>
      <div class="opciones" data-opcion="voz">
        <button class="op activo" data-v="si">Sí</button>
        <button class="op" data-v="no">No</button>
      </div>
      <div class="ayuda" id="ayudaVoz"></div>
    </div>

    <button class="principal" id="jugar">Jugar</button>
    <div class="pie">Cada partida elige palabras al azar de toda la base.</div>
  </div>
</section>

<header id="barra" class="oculto">
  <span class="dato">Pares <b id="vPares">0/0</b></span>
  <span class="dato">Intentos <b id="vIntentos">0</b></span>
  <span class="dato">Tiempo <b id="vTiempo">0:00</b></span>
  <span class="espacio"></span>
  <button class="sec" id="reiniciar">Nueva partida</button>
  <button class="sec" id="volver">Menú</button>
</header>

<main id="zona" class="oculto"><div id="tablero"></div></main>

<section id="final" class="oculto">
  <div class="caja">
    <h1>¡Completado! <span class="jp">おめでとう</span></h1>
    <div class="resumen">
      <div><b id="fIntentos"></b><small>intentos</small></div>
      <div><b id="fTiempo"></b><small>tiempo</small></div>
      <div><b id="fPrecision"></b><small>precisión</small></div>
    </div>
    <div class="record" id="fRecord"></div>
    <div class="grupo"><span>Repaso de esta partida</span></div>
    <table id="fLista"></table>
    <div class="botones">
      <button class="principal" id="otra">Otra partida</button>
      <button class="sec" id="fMenu">Menú</button>
    </div>
  </div>
</section>

/* ================================================================ */

const $ = (id) => document.getElementById(id);
const conf = { pares: 8, tipo: "todos", modo: "clasico", romaji: "si", voz: "si" };

let cartas = [], elegidas = [], abiertas = [], bloqueado = false;
let encontrados = 0, intentos = 0, inicio = 0, reloj = null;

$("total").textContent = PALABRAS.length;

/* ---------- menú ---------- */
document.querySelectorAll(".opciones").forEach((grupo) => {
  grupo.addEventListener("click", (e) => {
    const b = e.target.closest(".op");
    if (!b) return;
    grupo.querySelectorAll(".op").forEach((x) => x.classList.toggle("activo", x === b));
    conf[grupo.dataset.opcion] = b.dataset.v;
    actualizarAyuda();
  });
});

function actualizarAyuda() {
  $("ayudaModo").textContent = conf.modo === "clasico"
    ? "Las dos cartas del par son iguales (como las impresas)."
    : "Juntá la palabra japonesa con su significado en español.";
  $("grupoRomaji").classList.toggle("oculto", conf.modo !== "aprender");
  $("ayudaVoz").textContent = hayVozJapones() ? "" :
    "Tu PC no tiene voz en japonés instalada: el juego funciona igual, pero sin sonido.";
}

/* ---------- voz ---------- */
function vozJapones() {
  if (!("speechSynthesis" in window)) return null;
  return speechSynthesis.getVoices().find((v) => v.lang && v.lang.toLowerCase().startsWith("ja")) || null;
}
function hayVozJapones() { return !!vozJapones(); }
if ("speechSynthesis" in window) speechSynthesis.onvoiceschanged = actualizarAyuda;
function decir(texto) {
  const v = vozJapones();
  if (conf.voz !== "si" || !v) return;
  const u = new SpeechSynthesisUtterance(texto.replace(/^～/, ""));
  u.voice = v; u.lang = v.lang; u.rate = 0.85;
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}

/* ---------- partida ---------- */
function mezclar(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function elegirPalabras(n) {
  const pool = mezclar(PALABRAS.filter((p) => conf.tipo === "todos" || p.tipo === conf.tipo));
  const vistos = new Set(), vistosEs = new Set(), res = [];
  for (const p of pool) {
    // no repetir kana (あつい...) ni significado (en modo aprender confunde)
    if (vistos.has(p.kana) || vistosEs.has(p.espanol)) continue;
    vistos.add(p.kana); vistosEs.add(p.espanol); res.push(p);
    if (res.length === n) break;
  }
  return res;
}

function nuevaPartida() {
  elegidas = elegirPalabras(Number(conf.pares));
  cartas = [];
  elegidas.forEach((p, i) => {
    if (conf.modo === "clasico") {
      cartas.push({ par: i, lado: "a" }, { par: i, lado: "b" });
    } else {
      cartas.push({ par: i, lado: "jp" }, { par: i, lado: "es" });
    }
  });
  mezclar(cartas);
  abiertas = []; bloqueado = false; encontrados = 0; intentos = 0;
  clearInterval(reloj); inicio = 0; $("vTiempo").textContent = "0:00";
  dibujarTablero(); actualizarBarra();
  $("menu").classList.add("oculto"); $("final").classList.add("oculto");
  $("barra").classList.remove("oculto"); $("zona").classList.remove("oculto");
  ajustarTamano();
}

function contenidoCarta(c) {
  const p = elegidas[c.par];
  const kana = `<div class="kana">${p.kana}</div>`;
  const romaji = `<div class="romaji">${p.romaji}</div>`;
  const es = `<div class="es">${p.espanol}</div>`;
  if (c.lado === "es") return es;
  if (c.lado === "jp") return kana + (conf.romaji === "si" ? romaji : "");
  return kana + romaji + es;
}

function dibujarTablero() {
  const t = $("tablero");
  t.innerHTML = "";
  cartas.forEach((c, i) => {
    const b = document.createElement("button");
    b.className = "carta";
    b.setAttribute("aria-label", "carta");
    b.innerHTML = `<div class="giro"><div class="cara dorso"></div>
      <div class="cara frente ${c.lado === "es" ? "solo-es" : ""}">${contenidoCarta(c)}</div></div>`;
    b.addEventListener("click", () => tocar(i, b));
    c.el = b;
    t.appendChild(b);
  });
}

function tocar(i, el) {
  const c = cartas[i];
  if (bloqueado || c.hecha || abiertas.includes(c)) return;
  if (!inicio) { inicio = Date.now(); reloj = setInterval(actualizarReloj, 500); }
  el.classList.add("vista");
  abiertas.push(c);
  if (conf.modo === "clasico" || c.lado === "jp") {
    if (abiertas.length === 1) decir(elegidas[c.par].kana);
  }
  if (abiertas.length < 2) return;

  intentos++;
  const [a, b] = abiertas;
  if (a.par === b.par) {
    a.hecha = b.hecha = true;
    a.el.classList.add("hecha"); b.el.classList.add("hecha");
    encontrados++; abiertas = [];
    decir(elegidas[a.par].kana);
    actualizarBarra();
    if (encontrados === elegidas.length) setTimeout(terminar, 600);
  } else {
    bloqueado = true;
    actualizarBarra();
    setTimeout(() => {
      a.el.classList.remove("vista"); b.el.classList.remove("vista");
      abiertas = []; bloqueado = false;
    }, 1000);
  }
}

function actualizarBarra() {
  $("vPares").textContent = `${encontrados}/${elegidas.length}`;
  $("vIntentos").textContent = intentos;
}
function formatoTiempo(ms) {
  const s = Math.floor(ms / 1000);
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
}
function actualizarReloj() { $("vTiempo").textContent = formatoTiempo(Date.now() - inicio); }

/* ---------- récords (se guardan en este navegador) ---------- */
function leerRecords() { try { return JSON.parse(localStorage.getItem("memotest-records") || "{}"); } catch { return {}; } }
function guardarRecords(r) { try { localStorage.setItem("memotest-records", JSON.stringify(r)); } catch {} }

function terminar() {
  clearInterval(reloj);
  const ms = Date.now() - inicio;
  $("fIntentos").textContent = intentos;
  $("fTiempo").textContent = formatoTiempo(ms);
  $("fPrecision").textContent = Math.round((elegidas.length / intentos) * 100) + "%";

  const clave = `${conf.modo}-${conf.pares}`;
  const records = leerRecords();
  const previo = records[clave];
  const nombreModo = conf.modo === "clasico" ? "clásico" : "aprender";
  if (!previo || intentos < previo.intentos || (intentos === previo.intentos && ms < previo.ms)) {
    records[clave] = { intentos, ms }; guardarRecords(records);
    $("fRecord").textContent = previo ? `¡Nuevo récord en ${conf.pares} pares (modo ${nombreModo})!` : "";
  } else {
    $("fRecord").textContent = `Récord en ${conf.pares} pares (modo ${nombreModo}): ${previo.intentos} intentos, ${formatoTiempo(previo.ms)}`;
  }

  $("fLista").innerHTML = elegidas
    .map((p) => `<tr><td class="k">${p.kana}</td><td class="r">${p.romaji}</td><td>${p.espanol}</td></tr>`)
    .join("");
  $("final").classList.remove("oculto");
}

/* ---------- tamaño de cartas según la ventana ---------- */
function ajustarTamano() {
  const n = cartas.length;
  if (!n) return;
  const zona = $("zona");
  const W = zona.clientWidth - 28, H = zona.clientHeight - 28, gap = 10, ratio = 1.15;
  let mejor = { w: 0 };
  for (let cols = 1; cols <= n; cols++) {
    const rows = Math.ceil(n / cols);
    const w = Math.min((W - gap * (cols - 1)) / cols, ((H - gap * (rows - 1)) / rows) / ratio);
    if (w > mejor.w) mejor = { w, cols };
  }
  const w = Math.floor(Math.min(mejor.w, 220));
  const t = $("tablero");
  t.style.gridTemplateColumns = `repeat(${mejor.cols}, ${w}px)`;
  t.style.setProperty("--w", w + "px");
  t.style.setProperty("--h", Math.floor(w * ratio) + "px");
  t.style.setProperty("--fk", Math.floor(w * 0.19) + "px");
  t.style.setProperty("--fr", Math.max(11, Math.floor(w * 0.095)) + "px");
  t.style.setProperty("--fe", Math.max(10, Math.floor(w * 0.085)) + "px");
  // achicar el kana si una palabra larga no entra
  requestAnimationFrame(() => {
    const max = w * 0.86;
    t.querySelectorAll(".kana, .es").forEach((k) => {
      k.style.fontSize = "";
      // la palabra más larga del texto tiene que entrar en el ancho de la carta
      const prueba = document.createElement("span");
      prueba.style.cssText = "position:absolute;visibility:hidden;white-space:nowrap";
      prueba.style.font = getComputedStyle(k).font;
      const largas = k.classList.contains("kana") ? [k.textContent] : k.textContent.split(/\s+/);
      let ancho = 0;
      largas.forEach((txt) => { prueba.textContent = txt; document.body.appendChild(prueba);
        ancho = Math.max(ancho, prueba.offsetWidth); prueba.remove(); });
      if (ancho > max) k.style.fontSize = Math.floor(parseFloat(getComputedStyle(k).fontSize) * max / ancho) + "px";
    });
  });
}
window.addEventListener("resize", ajustarTamano);

/* ---------- botones ---------- */
$("jugar").onclick = nuevaPartida;
$("reiniciar").onclick = nuevaPartida;
$("otra").onclick = nuevaPartida;
function irAlMenu() {
  clearInterval(reloj);
  ["barra", "zona", "final"].forEach((id) => $(id).classList.add("oculto"));
  $("menu").classList.remove("oculto");
}
$("volver").onclick = irAlMenu;
$("fMenu").onclick = irAlMenu;

actualizarAyuda();
</script>
